[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryscope-ok"
version = "0.3.0"
description = "Evidence-based long-term memory benchmark skeleton for openKylin"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
memoryscope = "memoryscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
